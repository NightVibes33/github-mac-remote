name: "iOS 27 Simulator — RustDesk + State"
run-name: "Remote iPhone Simulator"

on:
  push:
    branches: [main]
    paths:
      - ".github/ios-sim/launch.txt"
  workflow_dispatch:
    inputs:
      duration:
        description: "Remote session length (hours; 6-hour jobs cap usable time)"
        type: choice
        default: "2"
        options: ["1", "2", "3", "4", "5", "6"]
      restore_state:
        description: "Restore newest encrypted simulator checkpoint"
        type: boolean
        default: true
      enable_simject:
        description: "Attempt simulator tweak injection (experimental on iOS 27)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ios27-remote-simulator
  cancel-in-progress: false

jobs:
  remote-iphone:
    runs-on: xcode-27
    timeout-minutes: 355
    env:
      SIM_SESSION_HOURS: ${{ inputs.duration }}
      SIM_RESTORE: ${{ inputs.restore_state }}
      SIM_SIMJECT: ${{ inputs.enable_simject }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate simulator scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/ios-sim/*.sh scripts/setup-rustdesk.sh; do
            bash -n "$file"
          done
          node --check scripts/ios-sim/state-store.cjs

      - name: Check secrets and runtime
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
          SIMULATOR_STATE_PASSPHRASE: ${{ secrets.SIMULATOR_STATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$RUSTDESK_PASSWORD" || { echo "::error::Set the RUSTDESK_PASSWORD repository secret"; exit 1; }
          test -n "$SIMULATOR_STATE_PASSPHRASE" || { echo "::error::Set the SIMULATOR_STATE_PASSPHRASE repository secret"; exit 1; }
          echo "::add-mask::$RUSTDESK_PASSWORD"
          echo "::add-mask::$SIMULATOR_STATE_PASSPHRASE"
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
          node --version

      - name: Install snapshot artifact client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-sim-artifacts"
          npm install --prefix "$RUNNER_TEMP/ios-sim-artifacts" --no-audit --no-fund --no-save '@actions/artifact@2'

      - name: Create iOS 27 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ios-sim/*.sh
          bash scripts/ios-sim/prepare.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Restore previous encrypted state
        if: github.event_name == 'push' || inputs.restore_state
        shell: bash
        env:
          SIMULATOR_STATE_PASSPHRASE: ${{ secrets.SIMULATOR_STATE_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ios-sim/state-store.cjs restore

      - name: Install experimental tweak framework
        if: github.event_name == 'push' || inputs.enable_simject
        shell: bash
        run: |
          bash scripts/ios-sim/setup-simject.sh || {
            echo "::warning::simject could not initialize on this runner. The standard Simulator and RustDesk will still start."
            echo "simject: unavailable" >> "$GITHUB_STEP_SUMMARY"
          }

      - name: Boot simulator and test screenshot
        id: booted
        shell: bash
        run: |
          bash scripts/ios-sim/boot.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/setup-rustdesk.sh
          RD="/Applications/RustDesk.app/Contents/MacOS/rustdesk"
          ID=""
          for i in {1..15}; do
            ID=$("$RD" --get-id 2>/dev/null || true)
            test -n "$ID" && break
            sleep 3
          done
          if test -z "$ID"; then
            echo "::warning::RustDesk ID not available from CLI; inspect RustDesk on the runner."
          else
            echo "### RustDesk connection" >> "$GITHUB_STEP_SUMMARY"
            echo "ID: \`$ID\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Password: use your RUSTDESK_PASSWORD secret (never uploaded or printed)." >> "$GITHUB_STEP_SUMMARY"
            echo "Open the RustDesk client on your iPhone/PC to connect." >> "$GITHUB_STEP_SUMMARY"
            echo "RustDesk ID: $ID"
          fi

      - name: Remote session with automatic snapshots
        shell: bash
        env:
          SIMULATOR_STATE_PASSPHRASE: ${{ secrets.SIMULATOR_STATE_PASSPHRASE }}
        run: bash scripts/ios-sim/session.sh

      - name: Final encrypted checkpoint
        if: always() && steps.booted.outputs.ready == 'true'
        shell: bash
        env:
          SIMULATOR_STATE_PASSPHRASE: ${{ secrets.SIMULATOR_STATE_PASSPHRASE }}
        run: bash scripts/ios-sim/checkpoint.sh final

      - name: Screenshot and simulator diagnostics
        if: always() && steps.simulator.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p diagnostics
          xcrun simctl list devices > diagnostics/simulators.txt 2>&1 || true
          xcrun simctl list runtimes > diagnostics/runtimes.txt 2>&1 || true
          if test -f "$RUNNER_TEMP/simject-status.txt"; then
            cp "$RUNNER_TEMP/simject-status.txt" diagnostics/simject-status.txt
          fi
          if test -f "$RUNNER_TEMP/ios-simulator-last.png"; then
            cp "$RUNNER_TEMP/ios-simulator-last.png" diagnostics/last-screenshot.png
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.simulator.outputs.ready == 'true'
        with:
          name: ios-simulator-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 3
          if-no-files-found: ignore
