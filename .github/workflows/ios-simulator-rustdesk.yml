name: "iOS 27 Simulator — RustDesk + State"
run-name: "Remote iPhone Simulator"

on:
  push:
    branches: [main]
    paths:
      - ".github/ios-sim/launch.txt"
      - ".github/workflows/ios-simulator-rustdesk.yml"
  workflow_dispatch:
    inputs:
      duration:
        description: "Remote session length (hours; 6-hour jobs cap usable time)"
        type: choice
        default: "2"
        options: ["1", "2", "3", "4", "5", "6"]
      restore_state:
        description: "Restore newest encrypted simulator checkpoint"
        type: boolean
        default: true
      enable_simject:
        description: "Attempt simulator tweak injection (experimental on iOS 27)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ios27-remote-simulator
  cancel-in-progress: false

jobs:
  remote-iphone:
    runs-on: xcode-27
    environment: TAILSCALE_AUTH_KEY
    timeout-minutes: 355
    env:
      SIM_SESSION_HOURS: ${{ inputs.duration }}
      SIM_RESTORE: ${{ inputs.restore_state }}
      SIM_SIMJECT: ${{ inputs.enable_simject }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate simulator scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/ios-sim/*.sh scripts/setup-rustdesk.sh; do
            bash -n "$file"
          done
          node --check scripts/ios-sim/state-store.cjs

      - name: Check secrets and runtime
        id: config
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
          SIMULATOR_STATE_PASSPHRASE: ${{ secrets.SIMULATOR_STATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if test -n "$RUSTDESK_PASSWORD"; then
            echo "::add-mask::$RUSTDESK_PASSWORD"
            echo "rustdesk=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RUSTDESK_PASSWORD is missing: boot and screenshot proof only; RustDesk disabled"
            echo "rustdesk=false" >> "$GITHUB_OUTPUT"
          fi
          if test -n "$SIMULATOR_STATE_PASSPHRASE"; then
            echo "::add-mask::$SIMULATOR_STATE_PASSPHRASE"
            echo "state=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIMULATOR_STATE_PASSPHRASE is missing: encrypted state persistence disabled"
            echo "state=false" >> "$GITHUB_OUTPUT"
          fi
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes
          node --version

      - name: Install snapshot artifact client
        if: steps.config.outputs.state == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-sim-artifacts"
          npm install --prefix "$RUNNER_TEMP/ios-sim-artifacts" --no-audit --no-fund --no-save '@actions/artifact@2'

      - name: Create iOS 27 simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ios-sim/*.sh
          bash scripts/ios-sim/prepare.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Restore previous encrypted state
        if: steps.config.outputs.state == 'true' && (github.event_name == 'push' || inputs.restore_state)
        shell: bash
        env:
          SIMULATOR_STATE_PASSPHRASE: ${{ secrets.SIMULATOR_STATE_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ios-sim/state-store.cjs restore

      - name: Install experimental tweak framework
        if: github.event_name == 'push' || inputs.enable_simject
        shell: bash
        run: |
          bash scripts/ios-sim/setup-simject.sh || {
            echo "::warning::simject could not initialize on this runner. The standard Simulator and RustDesk will still start."
            echo "simject: unavailable" >> "$GITHUB_STEP_SUMMARY"
          }

      - name: Boot simulator and test screenshot
        id: booted
        shell: bash
        run: |
          bash scripts/ios-sim/boot.sh
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload boot screenshot immediately
        if: steps.booted.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-boot-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-simulator-last.png
          retention-days: 7
          if-no-files-found: error

      - name: Join Tailscale network for iPhone Simulator
        continue-on-error: true
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "::error::Missing TAILSCALE_AUTH_KEY environment secret"
            exit 1
          fi
          brew install tailscale
          sudo brew services start tailscale || {
            sudo "$(brew --prefix)/opt/tailscale/bin/tailscaled" >/tmp/ios27-tailscaled.log 2>&1 &
            sleep 5
          }
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="ios27-simulator-${{ github.run_id }}"
          TAILSCALE_IP=$(tailscale ip -4)
          test -n "$TAILSCALE_IP"
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"
          printf '### Remote iPhone Simulator\\nTailscale IP: %s\\n' "$TAILSCALE_IP" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable VNC access to Simulator host
        shell: bash
        run: |
          set -euo pipefail
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          VNC_PASSWORD=$(openssl rand -hex 4)
          echo "::add-mask::$VNC_PASSWORD"
          sudo "$KICKSTART" -activate -configure -access -on -allowAccessFor -allUsers -privs -all -clientopts -setvnclegacy -vnclegacy yes -clientopts -setvncpw -vncpw "$VNC_PASSWORD" -restart -agent -menu
          mkdir -p "$RUNNER_TEMP/ios27-connection"
          printf 'Tailscale IP: %s\\nVNC port: 5900\\nVNC password: %s\\nTarget: iOS 27 Simulator window on macOS host\\n' "$TAILSCALE_IP" "$VNC_PASSWORD" > "$RUNNER_TEMP/ios27-connection/connection.txt"
          if ! sudo lsof -nP -iTCP:5900 -sTCP:LISTEN | grep -q LISTEN; then
            echo "::error::VNC port 5900 is not listening"
            exit 1
          fi
          echo "::warning::VNC shares host display; a headless macOS desktop may be black even though the simulator boots"

      - name: Upload iPhone Simulator VNC credentials
        uses: actions/upload-artifact@v4
        with:
          name: ios27-vnc-credentials-${{ github.run_id }}
          path: ${{ runner.temp }}/ios27-connection/connection.txt
          retention-days: 1

      - name: Publish temporary Cloudflare browser VNC
        if: steps.booted.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install cloudflared
          git clone --depth 1 https://github.com/novnc/noVNC.git "$RUNNER_TEMP/novnc"
          git clone --depth 1 https://github.com/novnc/websockify.git "$RUNNER_TEMP/websockify"
          python3 "$RUNNER_TEMP/websockify/run" --web "$RUNNER_TEMP/novnc" 127.0.0.1:6080 127.0.0.1:5900 > "$RUNNER_TEMP/websockify.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/websockify.pid"
          sleep 3
          curl -fsS http://127.0.0.1:6080/vnc.html -o /dev/null
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"
          URL=""
          for i in {1..40}; do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+[.]trycloudflare[.]com' "$RUNNER_TEMP/cloudflared.log" | head -1 || true)
            test -n "$URL" && break
            sleep 3
          done
          if [ -z "$URL" ]; then
            cat "$RUNNER_TEMP/cloudflared.log"
            echo "::error::Cloudflare tunnel did not return a URL"
            exit 1
          fi
          echo "### Temporary browser VNC (iPhone Safari)" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL/vnc.html" >> "$GITHUB_STEP_SUMMARY"
          echo "This temporary URL stops working when the runner exits (maximum six hours)." >> "$GITHUB_STEP_SUMMARY"
          echo "VNC password is in the ios27-vnc-credentials artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare URL: $URL/vnc.html"

      - name: Set up RustDesk
        if: steps.config.outputs.rustdesk == 'true'
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/setup-rustdesk.sh
          RD="/Applications/RustDesk.app/Contents/MacOS/rustdesk"
          ID=""
          for i in {1..15}; do
            ID=$("$RD" --get-id 2>/dev/null || true)
            test -n "$ID" && break
            sleep 3
          done
          if test -z "$ID"; then
            echo "::warning::RustDesk ID not available from CLI; inspect RustDesk on the runner."
          else
            echo "### RustDesk connection" >> "$GITHUB_STEP_SUMMARY"
            echo "ID: \`$ID\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Password: use your RUSTDESK_PASSWORD secret (never uploaded or printed)." >> "$GITHUB_STEP_SUMMARY"
            echo "Open the RustDesk client on your iPhone/PC to connect." >> "$GITHUB_STEP_SUMMARY"
            echo "RustDesk ID: $ID"
          fi

      - name: Remote session with automatic snapshots
        if: steps.booted.outputs.ready == 'true'
        shell: bash
        env:
          SIMULATOR_STATE_PASSPHRASE: ${{ secrets.SIMULATOR_STATE_PASSPHRASE }}
        run: bash scripts/ios-sim/session.sh

      - name: Final encrypted checkpoint
        if: always() && steps.booted.outputs.ready == 'true' && steps.config.outputs.state == 'true'
        shell: bash
        env:
          SIMULATOR_STATE_PASSPHRASE: ${{ secrets.SIMULATOR_STATE_PASSPHRASE }}
        run: bash scripts/ios-sim/checkpoint.sh final

      - name: Screenshot and simulator diagnostics
        if: always() && steps.simulator.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p diagnostics
          xcrun simctl list devices > diagnostics/simulators.txt 2>&1 || true
          xcrun simctl list runtimes > diagnostics/runtimes.txt 2>&1 || true
          if test -f "$RUNNER_TEMP/simject-status.txt"; then
            cp "$RUNNER_TEMP/simject-status.txt" diagnostics/simject-status.txt
          fi
          if test -f "$RUNNER_TEMP/ios-simulator-last.png"; then
            cp "$RUNNER_TEMP/ios-simulator-last.png" diagnostics/last-screenshot.png
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.simulator.outputs.ready == 'true'
        with:
          name: ios-simulator-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 3
          if-no-files-found: ignore
